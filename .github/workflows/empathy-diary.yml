# Empathy diary (Study-05): answers one diary entry from the web page.
# Started by the page's "Share with my diary" button (workflow_dispatch); there is
# no schedule, so it costs nothing until you use it.
#
# This repo is public, so its Actions logs and run inputs are public too.
# The diary entry and the answer travel only through the secret Gist, encrypted;
# the only input here is a random request ID, and the log shows only
# progress words.
name: Empathy Diary
run-name: Empathy Diary ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Request ID made by the Empathy Diary page"
        required: true
        type: string

permissions:
  contents: read

# One run per request ID at a time. A re-dispatch of the same ID waits, then
# ci/run-request.mjs finds the request file gone and refuses without calling Claude.
concurrency:
  group: empathy-diary-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Study-05
    steps:
      # Third-party actions are pinned to full commit SHAs (a tag can be moved).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: Study-05
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Study-05/package-lock.json

      - name: Install packages
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Answer the request
        # Secrets only in this step, so checkout, setup-node and npm ci never see them.
        # Passed through env (not ${{ }} inside run:), so input text can't become shell code.
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          FC_PASSPHRASE: ${{ secrets.FC_PASSPHRASE }}
          FC_GIST_ID: ${{ secrets.FC_GIST_ID }}
          FC_GIST_TOKEN: ${{ secrets.FC_GIST_TOKEN }}
        run: node ci/run-request.mjs
