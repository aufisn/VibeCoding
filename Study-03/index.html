<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Quiz Game</title>
    <script>
      // Apply a saved light/dark choice before the first paint (see js/theme.js).
      try {
        var saved = localStorage.getItem("quiz.theme");
        if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <p class="brand"><span class="brand-mark" aria-hidden="true">?</span>Quiz Game</p>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">
          <svg class="icon-line theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
          </svg>
          <svg class="icon-line theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <span class="theme-toggle-text">Dark mode</span>
          <span class="switch" aria-hidden="true"><span class="switch-knob"></span></span>
        </button>
      </div>
    </header>
    <!-- js/ui.js renders one screen at a time into #app. -->
    <main id="app" class="app">
      <p class="status" role="status">Loading questions…</p>
      <noscript><p class="status">This quiz needs JavaScript to run.</p></noscript>
    </main>
  </body>
</html>
